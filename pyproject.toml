[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragathon"
version = "0.1.0"
description = "Parallel-friendly multi-agent RAG workflow engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "google-genai>=1.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2.9",
  "PyJWT>=2.9",
  "pypdf>=6.0",
  "reportlab>=4.4",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "ddgs>=9.0",
  "tavily-python>=0.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

